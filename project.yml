name: VitaminDTracker
options:
  bundleIdPrefix: com.katecatlin
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

# NOTE: Code signing is intentionally NOT configured here.
# DEVELOPMENT_TEAM must NOT be committed to this OSS repo.
# Set it locally via: Xcode > Signing & Capabilities, or via a
# gitignored Signing.xcconfig (see Signing.xcconfig.template).

packages:
  VitaminDTrackerCore:
    path: .

targets:
  VitaminDTracker:
    type: application
    platform: iOS
    sources:
      - VitaminDTracker
    dependencies:
      - package: VitaminDTrackerCore
        product: VitaminDTrackerCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        # App uses no custom/proprietary encryption (only standard iOS
        # APIs / Keychain). Setting this avoids the export-compliance
        # prompt on every App Store submission.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
